server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    # Ces valeurs sont injectées via variables d'environnement (voir docker-compose.yml / .env)
    # Format d'URL Neon : jdbc:postgresql://<host>/<database>?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agence_user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      # "update" auto-alters the live schema on every boot — convenient for a solo/early-stage
      # project but risky once real data is at stake. Consider moving to Flyway/Liquibase with
      # ddl-auto: validate before this goes to real production traffic.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:ChangeMeThisIsADevOnlySecretKeyPleaseReplaceInProd123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@agence.local}
    from-name: ${MAIL_FROM_NAME:Agence Travel}
    code-expiration-minutes: ${EMAIL_CODE_EXPIRATION_MINUTES:10}
  cors:
    # Comma-separated allowlist of frontend origins allowed to call this API with credentials.
    # MUST be overridden in production via the FRONTEND_ORIGINS env var — never use "*" here.
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:4200,http://localhost:4000}
  rate-limit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.agence.userservice: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: INFO
